name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint ansible/

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install ansible-lint>=25.0
      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install 'community.general>=10.0' 'ansible.posix>=2.0'
      - name: Run ansible-lint
        run: ansible-lint ansible/

  nftables-syntax:
    name: nftables syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install nftables + ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables ansible
          ansible-galaxy collection install community.general ansible.posix
      - name: Render template with fixture vars
        run: |
          mkdir -p /tmp/nft-check
          cat > /tmp/nft-check/vars.yml <<'EOF'
          mgmt_cidrs_v4: ["10.0.0.0/8"]
          mgmt_cidrs_v6: []
          manifest_port: 9001
          metrics_port: 9091
          otlp_endpoint: ""
          EOF
          cat > /tmp/nft-check/render.yml <<EOF
          - hosts: localhost
            gather_facts: false
            connection: local
            vars_files:
              - /tmp/nft-check/vars.yml
            tasks:
              - template:
                  src: ${GITHUB_WORKSPACE}/ansible/roles/firewall/templates/bitcoin-shard-manifest.nft.j2
                  dest: /tmp/nft-check/rendered.nft
          EOF
          ansible-playbook /tmp/nft-check/render.yml
      - name: Validate rendered ruleset
        run: sudo nft -c -f /tmp/nft-check/rendered.nft
