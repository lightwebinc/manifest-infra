name: Lint

on:
  # main only. `branches: ["**"]` alongside pull_request ran this twice for
  # every PR — once for the branch push, once for the PR — and the
  # concurrency group cannot dedupe them: github.ref differs between the
  # two events. The PR trigger still covers branches, and it is the run
  # that gates the merge.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible:
    uses: lightwebinc/ci/.github/workflows/ansible-lint.yml@b49f597d563387ae78f599ee22673124a602e736 # v0.2.0
    with:
      collections: "community.general>=10.0"

  nftables-syntax:
    name: nftables syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nftables + ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables ansible
          ansible-galaxy collection install community.general
      - name: Render template with fixture vars
        run: |
          mkdir -p /tmp/nft-check
          cat > /tmp/nft-check/vars.yml <<'EOF'
          mgmt_cidrs_v4: ["10.0.0.0/8"]
          mgmt_cidrs_v6: []
          manifest_port: 9001
          metrics_port: 9091
          otlp_endpoint: ""
          EOF
          cat > /tmp/nft-check/render.yml <<EOF
          - hosts: localhost
            gather_facts: false
            connection: local
            vars_files:
              - /tmp/nft-check/vars.yml
            tasks:
              - template:
                  src: ${GITHUB_WORKSPACE}/ansible/roles/firewall/templates/shard-manifest.nft.j2
                  dest: /tmp/nft-check/rendered.nft
          EOF
          ansible-playbook /tmp/nft-check/render.yml
      - name: Validate rendered ruleset
        run: sudo nft -c -f /tmp/nft-check/rendered.nft
