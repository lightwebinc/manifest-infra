---
all:
  children:
    manifest_nodes:
      vars:
        ansible_user: ubuntu

        # NOTE: any variable that has a default in group_vars/all.yml
        # (shard_bits, mgmt_cidrs_v4/v6, manifest_scope, enable_firewall,
        # iface, role_hint, ...) must be set per-host under hosts: to take
        # effect. Ansible gives group_vars/all higher precedence than
        # inventory group vars:, so values placed here would be silently
        # overridden by the group_vars/all.yml defaults.

      hosts:
        manifest-01:
          ansible_host: 203.0.113.80
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          iface: eth0
          shard_bits: 4
          role_hint: proxy
          joined_groups: "all"
          generation_id: "00112233445566778899aabbccddeeff"
          authoritative: true
          # Firewall allow-list for SSH / metrics scrape.
          # MUST be set to your management network(s).
          mgmt_cidrs_v4:
            - "10.0.0.0/8"

        manifest-02:
          ansible_host: 198.51.100.81
          ansible_user: freebsd
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          iface: vtnet0
          shard_bits: 4
          role_hint: listener
          joined_groups: "0,3,5"
          mgmt_cidrs_v4:
            - "10.0.0.0/8"
