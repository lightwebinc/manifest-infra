---
# ============================================================
# manifest-infra Ansible group_vars/all.yml
# Override any variable per-host in inventory/hosts.yml
# ============================================================

# ------------------------------------------------------------
# shard-manifest source and build
# ------------------------------------------------------------
go_install_dir: "/usr/local/go"
go_version: "1.25.12"                   # Go toolchain (used when building from source)
manifest_bin_dir: "/usr/local/bin"
manifest_force_build: false             # force rebuild even when binary exists
manifest_group: "manifest-infra"
manifest_install_dir: "/opt/shard-manifest"
# Pre-built local binary (skips git/build when set)
# manifest_local_binary: "/path/to/local/shard-manifest"
manifest_repo: "https://github.com/lightwebinc/shard-manifest.git"
manifest_user: "manifest-infra"
manifest_version: "v0.3.0"              # release tag; use "main" only for development

# ------------------------------------------------------------
# Manifest content (BRC-139)
# ------------------------------------------------------------
authoritative: false                    # set Flags.Authoritative on the wire
generation_id: ""                       # 16-byte hex; bump whenever shard_bits changes
instance_id: ""                         # OTel service.instance.id; empty = hostname
joined_groups: ""                       # comma list of indices (hex/dec), or "all", or empty
manifest_encoding: "auto"               # auto | list | bitmap
role_hint: "generic"                    # generic | proxy | listener | retry-endpoint | producer | manifest-only
shard_bits: 2                           # 0..12; MUST match the rest of the network

# ------------------------------------------------------------
# Network
# ------------------------------------------------------------
iface: ""                               # egress interface; empty = first non-loopback global IPv6 iface
manifest_port: 9001                     # UDP destination port on the beacon group
manifest_scope: "site"                  # comma list: link, site, org, global
mc_group_id: "0x000B"                   # IANA group-id (default 0x000B = IANA Bitcoin)

# ------------------------------------------------------------
# Cadence
# ------------------------------------------------------------
announce_interval: "300s"               # send period
ttl: "0s"                               # 0 = consumer default (3 × interval)

# ------------------------------------------------------------
# SSM data-plane advertisement (BRC-139)
# ------------------------------------------------------------
manifest_publishers: ""                 # comma list of data-plane publisher IPv6 addresses or DNS names (SSM Sources payload)
manifest_publishers_refresh: "30s"      # DNS re-resolve interval for manifest_publishers entries (>0)
manifest_source_mode: "asm"             # asm | ssm; ssm REQUIRES manifest_publishers to be non-empty

# ------------------------------------------------------------
# Generation rollover / Successor block (BRC-139 §Successor)
# Leave manifest_successor_generation_id empty to disable. When set,
# manifest_successor_transition_epoch is REQUIRED and every other
# successor_* var takes effect.
# ------------------------------------------------------------
manifest_pilot_only: false              # set Flags.PilotOnly: manifest describes desired fleet state, not own joins (implies authoritative)
manifest_successor_generation_id: ""    # incoming generation 16-byte hex; empty = no Successor block
manifest_successor_shard_bits: 0        # incoming generation shard_bits (must differ from shard_bits by ±1)
manifest_successor_source_mode: ""      # incoming generation addressing model: asm | ssm; empty = inherit manifest_source_mode
manifest_successor_transition_epoch: 0  # Unix seconds at which the successor becomes the sole active generation

# ------------------------------------------------------------
# Observability
# ------------------------------------------------------------
# Unified logging — see https://github.com/lightwebinc/shard-common/blob/main/docs/logging.md
log_format: "json"                      # text | json (json default for this daemon)
log_level: "info"                       # debug|info|warn|error; runtime-togglable via POST /loglevel + SIGHUP
manifest_debug: false
metrics_addr: "[::]:9091"               # /metrics, /healthz, /readyz HTTP listener
metrics_port: 9091                      # MUST match the port in metrics_addr (used by firewall rules)
otlp_endpoint: ""                       # OTLP gRPC endpoint; empty disables push
otlp_interval: "15s"
trace_sampling: 0                       # 0..1 trace head sampling (0 = off; exports via otlp_endpoint)

# ------------------------------------------------------------
# Firewall perimeter
# ------------------------------------------------------------
enable_firewall: true
mgmt_cidrs_v4: []                       # SSH / metrics scrape allow-list (IPv4). MUST be set per deployment.
mgmt_cidrs_v6: []                       # SSH / metrics scrape allow-list (IPv6).
