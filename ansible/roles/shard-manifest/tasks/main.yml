---
- name: Create manifest system group
  ansible.builtin.group:
    name: "{{ manifest_group }}"
    system: true
    state: present

- name: Create manifest system user
  ansible.builtin.user:
    name: "{{ manifest_user }}"
    group: "{{ manifest_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ manifest_install_dir }}"
    create_home: false
    state: present

- name: Create manifest install directory
  ansible.builtin.file:
    path: "{{ manifest_install_dir }}"
    state: directory
    owner: "{{ manifest_user }}"
    group: "{{ manifest_group }}"
    mode: "0755"

- name: Mark install directory as git safe.directory
  ansible.builtin.command:
    cmd: git config --global --add safe.directory {{ manifest_install_dir }}
  changed_when: false
  when: manifest_local_binary | default('') | length == 0
  tags: [skip_ansible_lint]

- name: Clone or update shard-manifest repository
  ansible.builtin.shell: |
    set -eu
    if [ ! -d "{{ manifest_install_dir }}/.git" ]; then
      git clone {{ manifest_repo | quote }} {{ manifest_install_dir | quote }}
    fi
    cd {{ manifest_install_dir | quote }}
    git fetch --all --tags --prune
    git checkout {{ manifest_version | quote }}
    git pull --ff-only || true
  args:
    executable: /bin/bash
  register: manifest_clone
  changed_when: "'Already up to date' not in manifest_clone.stdout"
  when: manifest_local_binary | default('') | length == 0

- name: Push pre-built manifest binary (skips git/build)
  ansible.builtin.copy:
    src: "{{ manifest_local_binary }}"
    dest: "{{ manifest_install_dir }}/shard-manifest"
    owner: "{{ manifest_user }}"
    group: "{{ manifest_group }}"
    mode: "0755"
  when: manifest_local_binary | default('') | length > 0

# A pushed binary was not built here, so the build record no longer describes it.
- name: Drop the build record for a pushed binary
  ansible.builtin.file:
    path: "{{ manifest_install_dir }}/.built-ref"
    state: absent
  when: manifest_local_binary | default('') | length > 0

- name: Set ownership of install directory after clone
  ansible.builtin.file:
    path: "{{ manifest_install_dir }}"
    owner: "{{ manifest_user }}"
    group: "{{ manifest_group }}"
    recurse: true
  when: manifest_local_binary | default('') | length == 0

- name: Stat existing manifest binary in install dir
  ansible.builtin.stat:
    path: "{{ manifest_install_dir }}/shard-manifest"
  register: manifest_binary_stat
  when: manifest_local_binary | default('') | length == 0

- name: Read the installed Go toolchain version
  ansible.builtin.command: "{{ go_install_dir }}/bin/go env GOVERSION"
  environment:
    GOTOOLCHAIN: local
  register: manifest_go_installed
  changed_when: false
  check_mode: false
  failed_when: false
  when: manifest_local_binary | default('') | length == 0

# A run limited by tags skips the common role, which installs Go. Building
# with another release would miss the pinned toolchain and rebuild every run.
- name: Require the pinned Go toolchain for source builds
  ansible.builtin.assert:
    that:
      - manifest_go_installed.stdout | default('') | trim == 'go' ~ go_version
    fail_msg: >-
      {{ go_install_dir }} holds {{ manifest_go_installed.stdout | default('no Go') }},
      not go{{ go_version }}. Run the common role first (the play without tags, or with the common tag).
  # A dry run installs nothing, so the toolchain it reads may be the one about to be replaced.
  when:
    - manifest_local_binary | default('') | length == 0
    - not ansible_check_mode

- name: Read the Go version the existing binary was built with
  ansible.builtin.command: "{{ go_install_dir }}/bin/go version {{ manifest_install_dir }}/shard-manifest"
  register: manifest_binary_go
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - manifest_local_binary | default('') | length == 0
    - manifest_binary_stat.stat.exists

# A branch name stays the same while its commit moves, so the record carries both.
# A dry run leaves the checkout alone: there the commit is the one the clone task predicts.
- name: Read the checked-out commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ manifest_install_dir }}"
  register: manifest_head
  changed_when: false
  check_mode: false
  failed_when: false
  when: manifest_local_binary | default('') | length == 0
  tags: [skip_ansible_lint]

- name: Read the release and commit the existing binary was built from
  ansible.builtin.command: "cat {{ manifest_install_dir }}/.built-ref"
  register: manifest_built_ref
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - manifest_local_binary | default('') | length == 0
    - manifest_binary_stat.stat.exists

# A binary built with another Go release, or from another release or commit of
# the source, is rebuilt: a toolchain move or a version pin move reaches a
# deployed node without manifest_force_build.
- name: Decide whether the binary is rebuilt
  ansible.builtin.set_fact:
    manifest_rebuild: >-
      {{ not manifest_binary_stat.stat.exists
      or (manifest_force_build | default(false) | bool)
      or (manifest_binary_go.stdout | default('')).split() | last | default('') != 'go' ~ go_version
      or (manifest_built_ref.stdout | default('')) | trim != manifest_version ~ ' ' ~
      (manifest_clone.after | default(manifest_head.stdout | default(''), true) | trim) }}
  when: manifest_local_binary | default('') | length == 0

# Dropped first, so a run that stops between the build and the record rebuilds next time.
- name: Drop the build record before a rebuild
  ansible.builtin.file:
    path: "{{ manifest_install_dir }}/.built-ref"
    state: absent
  when:
    - manifest_local_binary | default('') | length == 0
    - manifest_rebuild | bool

- name: Build shard-manifest binary
  ansible.builtin.command:
    # Folded scalar: the one-line form ran past the 160-char lint limit. Folding
    # joins these lines with single spaces, so the command string is unchanged.
    cmd: >-
      {{ go_install_dir }}/bin/go build -buildvcs=false
      -ldflags "-s -w -X github.com/lightwebinc/shard-manifest/metrics.Version={{ manifest_version }}"
      -o {{ manifest_install_dir }}/shard-manifest .
    chdir: "{{ manifest_install_dir }}"
  environment:
    PATH: "{{ go_install_dir }}/bin:{{ ansible_env.PATH }}"
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    GOOS: "{{ 'freebsd' if ansible_os_family == 'FreeBSD' else 'linux' }}"
    GOARCH: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    HOME: "/tmp"
    GOPATH: "/tmp/gopath"
    GOCACHE: "/tmp/gocache"
  changed_when: true
  when:
    - manifest_local_binary | default('') | length == 0
    - manifest_rebuild | bool

- name: Record the release and commit the binary was built from
  ansible.builtin.copy:
    content: "{{ manifest_version }} {{ manifest_clone.after | default(manifest_head.stdout | default(''), true) | trim }}\n"
    dest: "{{ manifest_install_dir }}/.built-ref"
    owner: "{{ manifest_user }}"
    group: "{{ manifest_group }}"
    mode: "0644"
  when: manifest_local_binary | default('') | length == 0

- name: Set ownership on built/pushed binary
  ansible.builtin.file:
    path: "{{ manifest_install_dir }}/shard-manifest"
    owner: "{{ manifest_user }}"
    group: "{{ manifest_group }}"
    mode: "0755"

- name: Install binary to system bin dir
  ansible.builtin.copy:
    src: "{{ manifest_install_dir }}/shard-manifest"
    dest: "{{ manifest_bin_dir }}/shard-manifest"
    remote_src: true
    owner: root
    group: "{{ manifest_group }}"
    mode: "0755"
  notify: Restart shard-manifest

- name: Create config directory
  ansible.builtin.file:
    path: "{{ '/usr/local/etc' if ansible_os_family == 'FreeBSD' else '/etc/shard-manifest' }}"
    state: directory
    owner: root
    group: "{{ manifest_group }}"
    mode: "0750"

- name: Deploy environment config file
  ansible.builtin.template:
    src: config.env.j2
    dest: "{{ '/usr/local/etc/shard-manifest.conf' if ansible_os_family == 'FreeBSD' else '/etc/shard-manifest/config.env' }}"
    owner: root
    group: "{{ manifest_group }}"
    mode: "0640"
  notify: Restart shard-manifest

- name: Deploy systemd service unit (Linux)
  ansible.builtin.template:
    src: shard-manifest.service.j2
    dest: /etc/systemd/system/shard-manifest.service
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family != 'FreeBSD'
  notify:
    - Reload systemd
    - Restart shard-manifest

- name: Deploy rc.d service script (FreeBSD)
  ansible.builtin.template:
    src: shard_manifest.rc.j2
    dest: /usr/local/etc/rc.d/shard_manifest
    owner: root
    group: wheel
    mode: "0755"
  when: ansible_os_family == 'FreeBSD'
  notify: Restart shard-manifest

- name: Enable and start shard-manifest (Linux)
  ansible.builtin.systemd:
    name: shard-manifest
    enabled: true
    state: started
  when: ansible_os_family != 'FreeBSD'

- name: Enable shard-manifest in rc.conf (FreeBSD)
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^shard_manifest_enable='
    line: 'shard_manifest_enable="YES"'
  when: ansible_os_family == 'FreeBSD'

- name: Start shard-manifest (FreeBSD)
  ansible.builtin.service:
    name: shard_manifest
    state: started
  when: ansible_os_family == 'FreeBSD'
