---
- name: Enable pf at boot
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: true
    mode: "0644"
  loop:
    - { regexp: '^pf_enable=', line: 'pf_enable="YES"' }
    - { regexp: '^pflog_enable=', line: 'pflog_enable="YES"' }

- name: Deploy shard-manifest pf anchor
  ansible.builtin.template:
    src: shard-manifest.pf.conf.j2
    dest: /etc/pf.anchors/shard-manifest
    owner: root
    group: wheel
    mode: "0644"
  notify: Reload pf

- name: Ensure /etc/pf.conf references the manifest anchor
  ansible.builtin.blockinfile:
    path: /etc/pf.conf
    create: true
    mode: "0644"
    marker: "# {mark} shard-manifest anchor"
    block: |
      anchor "shard-manifest"
      load anchor "shard-manifest" from "/etc/pf.anchors/shard-manifest"
  notify: Reload pf

- name: Enable pf service
  ansible.builtin.service:
    name: pf
    enabled: true
    state: started
